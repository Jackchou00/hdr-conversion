[project]
name = "hdr-conversion"
version = "0.1.5"
description = "tools for converting HDR images between different formats"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jack", email = "jackchou006@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "colour-science>=0.4.6",
    "imagecodecs>=2025.11.11",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pillow>=11.3.0",
    "pillow-heif>=0.22.0",
    "pyexiftool>=0.5.6",
]

[project.urls]
Homepage = "https://github.com/Jackchou00/hdr-conversion"
Repository = "https://github.com/Jackchou00/hdr-conversion"
Documentation = "https://jackchou00.github.io/hdr-conversion/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.0",
    "pytest>=9.0.2",
    "rich>=14.2.0",
    "ruff>=0.14.10",
    "pymdown-extensions>=10.19.1",
    "mike>=2.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hdrconv"]
